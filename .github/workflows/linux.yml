name: Build Linux Release App

on:
  push:
    paths:
      - 'linux_build.txt'
      - 'build.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # 1. 克隆私有仓库
      - name: Clone repository
        run: |
          git clone https://${{ secrets.SYNCTOKEN }}@github.com/Metamask-ctrl/baidu-pan.git

      # 2. 设置 Java 环境
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 安装 Linux 桌面端编译依赖库
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6 binutils

      # 4. 设置 Flutter 环境
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      # 5. 缓存管理
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            pub-linux-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}
            pub-linux-${{ runner.os }}

      # 6. 执行 Linux 核心打包脚本
      - name: Run Linux Build Script
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
        
          cd baidu-pan
          
          chmod +x build_linux.sh
          ./build_linux.sh

      # 7. 清理旧 Actions 缓存
      - name: Delete old Linux caches before saving new
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const currentRunId = "${{ github.run_id }}";
              for (const cache of caches.data.actions_caches) {
                const isLinuxCache = cache.key.startsWith('pub-linux-');
                const isNotCurrentRun = !cache.key.endsWith(currentRunId);
                if (isLinuxCache && isNotCurrentRun) {
                  console.log(`[Linux Cleanup] Deleting old cache: ${cache.key} (ID: ${cache.id})`);
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                }
              }
            } catch (error) {
              console.log('Error deleting old Linux caches:', error.message);
            }


      - name: Upload Linux Assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp output_linux/ \
            s3://${{ secrets.R2_BUCKET }}/v1.0.21/ \
            --endpoint-url https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --recursive \
            --exclude "*" \
            --include "pan-client-linux-x64-*.tar.gz" \
            --include "pan-client-linux-symbols-*.zip"



      # 8. 发布产物到 GitHub Releases
      - name: Release Linux App & Symbols to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ### pan_client Linux Release (Build ${{ github.run_number }})
            * **应用安装包**：`pan-client-linux-x64-v1.0.${{ github.run_number }}.tar.gz` （解压即用）
            * **解析符号表**：`pan-client-linux-symbols-v1.0.${{ github.run_number }}.zip` （保留备用，用于还原崩溃堆栈）
          files: |
            output_linux/pan-client-linux-x64-*.tar.gz
            output_linux/pan-client-linux-symbols-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
